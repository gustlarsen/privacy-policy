<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policies - Gustavo Larsen</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --heading-color: #f8fafc;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --border-color: #334155;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8fafc;
                --card-bg: #ffffff;
                --text-color: #334155;
                --text-muted: #64748b;
                --heading-color: #0f172a;
                --primary: #0284c7;
                --primary-hover: #0369a1;
                --border-color: #e2e8f0;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 3rem 1rem;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--heading-color);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .policy-card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            transition: transform 0.2s, border-color 0.2s;
            text-decoration: none;
            display: block;
            margin-bottom: 1rem;
        }

        .policy-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .policy-card h2 {
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 0.35rem;
        }

        .policy-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Application Privacy Policies</h1>
        <p class="subtitle">Official privacy policy repository for mobile and web applications by Gustavo Larsen.</p>

        <a class="policy-card" href="how-predictable-you-are.html">
            <h2>🎮 How Predictable You Are</h2>
            <p>Privacy policy for the Android / Google Play game. 100% offline with zero personal data collection.</p>
        </a>

        <footer>
            <p>&copy; 2026 Gustavo Larsen. Hosted on GitHub Pages.</p>
        </footer>
    </div>
</body>
</html>
